name: Windows release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content native/Native.csproj -Raw)
          if ($env:RELEASE_TAG -ne ('v' + $project.Project.PropertyGroup.Version)) {
            throw 'Release tag must match the version in native/Native.csproj.'
          }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained applications
        shell: pwsh
        run: |
          if ('${{ matrix.runtime }}' -eq 'win-x64') {
            ./build.ps1 -Runtime '${{ matrix.runtime }}' -Test
          } else {
            ./build.ps1 -Runtime '${{ matrix.runtime }}'
          }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup compiler download failed checksum verification.'
          }
          $compilerFolder = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process -FilePath $installer -WindowStyle Hidden -Wait -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$compilerFolder")
          "TRAFFIC_LENS_ISCC=$compilerFolder\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create ZIP, installer and checksums
        shell: pwsh
        run: |
          $includeSource = '${{ matrix.runtime }}' -eq 'win-x64'
          $project = [xml](Get-Content native/Native.csproj -Raw)
          ./scripts/package.ps1 -Runtime '${{ matrix.runtime }}' -Version $project.Project.PropertyGroup.Version -Compiler $env:TRAFFIC_LENS_ISCC -IncludeSource:$includeSource
      - uses: actions/upload-artifact@v7
        with:
          name: traffic-lens-${{ matrix.runtime }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat dist/*-SHA256SUMS.txt | sort -u > dist/SHA256SUMS.txt
          # A release created through the website owns its manually selected attachments.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; compiled packages remain available in Actions artifacts."
            exit 0
          fi
          # Keep the first release introduction bilingual, matching the README.
          awk 'found {print} /^## 首次 Release/ {found=1}' docs/REPOSITORY-INTRO.md > release-notes.md
          gh release create "$RELEASE_TAG" --draft --prerelease --verify-tag --title "Traffic Lens $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*-setup.exe dist/SHA256SUMS.txt
